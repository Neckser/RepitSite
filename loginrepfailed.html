<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Учебный портал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
        }

        .login-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .student-login {
            background-color: #6b8e23;
            color: white;
        }

        .tutor-login {
            background-color: white;
        }

        .login-container {
            width: 100%;
            max-width: 350px;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
        }

        .tutor-login h2 {
            color: #6b8e23;
        }

        .error-text {
            color: #ffffff;
            background-color: #ff3333;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .student-login label {
            color: white;
        }

        .tutor-login label {
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        .student-login input {
            background-color: rgba(255, 255, 255, 0.9);
        }

        .tutor-login input {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .student-login .login-btn {
            background-color: white;
            color: #6b8e23;
        }

        .student-login .login-btn:hover {
            background-color: #f5f5f5;
        }

        .tutor-login .login-btn {
            background-color: #6b8e23;
            color: white;
        }

        .tutor-login .login-btn:hover {
            background-color: #5a7a1f;
        }

        .register-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        .student-login .register-btn {
            background-color: transparent;
            color: white;
            border: 1px solid white;
        }

        .student-login .register-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .tutor-login .register-btn {
            background-color: transparent;
            color: #6b8e23;
            border: 1px solid #6b8e23;
        }

        .tutor-login .register-btn:hover {
            background-color: rgba(107, 142, 35, 0.1);
        }

        .divider {
            width: 1px;
            background-color: rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .divider {
                width: 100%;
                height: 1px;
            }
        }
    </style>
</head>
<body>
    <section class="login-section student-login">
        <div class="login-container">
            <h2>Вход для учеников</h2>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="student-login">Логин</label>
                    <input type="text" id="student-login" name="login"
                           placeholder="Введите логин" required>
                </div>
                <div class="form-group">
                    <label for="student-password">Пароль</label>
                    <input type="password" id="student-password" name="password"
                           placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="login-btn">Войти</button>
            </form>

            <button type="button" class="register-btn" onclick="location.href='/register'">
                Зарегистрироваться как ученик
            </button>
        </div>
    </section>

    <div class="divider"></div>

    <section class="login-section tutor-login">
        <div class="login-container">
            <h2>Вход для репетиторов</h2>
            <form action="/logintut" method="post">
                <div class="form-group">
                    <label for="tutor-login">Логин</label>
                    <input type="text" id="tutor-login" name="login" placeholder="Введите логин" required>
                </div>
                <div class="form-group">
                    <label for="tutor-password">Пароль</label>
                    <input type="password" id="tutor-password" name="password" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="login-btn">Войти</button>

                <div class="error-text">
                    ⚠ Неверный логин или пароль. Попробуйте снова!
                </div>
            </form>

            <button type="button" class="register-btn" onclick="location.href='/registertut'">
                Зарегистрироваться как репетитор
            </button>
        </div>
    </section>
</body>
</html>
