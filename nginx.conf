limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

map $http_user_agent $bad_bot {
    default 0;
    ~*(sqlmap|nikto|nmap|dirbuster|burpsuite|hydra|metasploit|wget|curl|python-requests) 1;
}

server {
    listen 80;
    server_name repithub.online www.repithub.online;
    return 301 https://repithub.online$request_uri;
}

server {
    listen 443 ssl;
    server_name www.repithub.online;
    ssl_certificate /etc/letsencrypt/live/repithub.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repithub.online/privkey.pem;

    return 301 https://repithub.online$request_uri;

}

server {
    listen 443 ssl http2;
    server_name repithub.online;
    ssl_certificate /etc/letsencrypt/live/repithub.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repithub.online/privkey.pem;

    server_tokens off;

    if ($bad_bot) { return 403; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /ws/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 90s;
    }

    location /ws/board/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 90s;
    }
}