events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # ==================== ЗАЩИТА ОТ DDoS ====================
    
    # 1. Ограничение запросов
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
    
    # 2. Блокировка сканеров
    map $http_user_agent $bad_bot {
        default 0;
        ~*(sqlmap|nikto|nmap|dirbuster|burpsuite|hydra|metasploit|wget|curl|python-requests) 1;
    }
    
    # 3. Защита от медленных соединений
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s 5s;
    
    # 4. Ограничение размера запроса
    client_max_body_size 10M;
    
    # ==================== СЕРВЕР ====================
    
    server {
        listen 80;
        server_name _;  # Любой домен
        
        # Блокируем сканеры
        if ($bad_bot) {
            return 403;
        }
        
        # Статические файлы (из build/)
        location /static/ {
            alias /app/build/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            limit_req zone=api burst=50;
        }
        
        # API endpoints (строгие лимиты)
        location ~ ^/(login|register|logintut|registertut) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Все остальное
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Health check
        location /health {
            access_log off;
            proxy_pass http://127.0.0.1:8000/health;
        }
    }
}