name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: 
        npm ci
        npm install typescript
    
    - name: Compile TypeScript
      run: |
          npx tsc src/app/templates/mainpages/mainpage/mainpage.ts --target es2015 --outDir src/app/templates/mainpages/mainpage
          npx tsc src/app/templates/profiles/editstudprofile/editstudprofile.ts --target es2015 --outDir src/app/templates/profiles/editstudprofile
          npx tsc src/app/templates/profiles/edittutprofile/edittutprofile.ts --target es2015 --outDir src/app/templates/profiles/edittutprofile
    
    - name: Checking style
      run: |
        npm run prettier:fix
        npm run prettier:check
        npm run eslint:fix
        npm run eslint:check
    
    - name: Build
      run: npm run esbuild