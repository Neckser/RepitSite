<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация ученика | RepitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #6b8e23;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .registration-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #6b8e23;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            background-color: white;
        }
        
        input:focus {
            outline: none;
            border-color: #6b8e23;
        }
        
        .register-btn {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            background-color: #6b8e23;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        
        .register-btn:hover {
            background-color: #5a7a1f;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .login-link a {
            color: #6b8e23;
            text-decoration: none;
            font-weight: bold;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .password-hint {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 480px) {
            .registration-container {
                padding: 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <h1>Регистрация ученика</h1>
        
        <form id="registration-form" action="/register" method="post">
            <div class="form-group">
                <label for="first-name">Имя</label>
                <input type="text" id="first-name" name="first_name" required>
            </div>
            
            <div class="form-group">
                <label for="last-name">Фамилия</label>
                <input type="text" id="last-name" name="last_name" required>
            </div>
            
            <div class="form-group">
                <label for="grade">Класс</label>
                <input type="number" id="grade" name="grade" min="1" max="11" required>
            </div>
            
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" required pattern="[A-Za-z0-9]+">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required pattern="[A-Za-z0-9]+">
                <div class="password-hint">Запомните ваш пароль. Мы не сможем его восстановить!</div>
            </div>
            
            <button type="submit" class="register-btn">Зарегистрироваться</button>
        </form>
        
        <div class="login-link">
            Уже есть аккаунт? <a href="/login">Войдите</a>
        </div>
    </div>
</body>
</html>
