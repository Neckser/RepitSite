<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Проставление оценок | RepitHub</title>
    </head>
    <body class="body">
        <header class="top-bar">
            <div class="top-bar__container">
                <div class="top-bar__nav">
                    <a href="/hometut" class="top-bar__nav-button">Главная</a>
                    <a href="/homeworkstut" class="top-bar__nav-button">Задания</a>
                    <a href="/tutgrades" class="top-bar__nav-button top-bar__nav-button_active">Оценки</a>
                    <a href="/tuttime" class="top-bar__nav-button">Расписание</a>
                    <a href="/tuttests" class="top-bar__nav-button">Тесты</a>
                </div>

                <a href="/profiletut" class="top-bar__account">
                    <div class="top-bar__avatar">{{ avatar }}</div>
                    <div class="top-bar__user-info">
                        <div class="top-bar__user-name">{{ first_name }} {{ last_name }}</div>
                        <div class="top-bar__user-role">Репетитор</div>
                    </div>
                </a>
            </div>
        </header>

        <div class="container">
            <div class="page-header">
                <h1 class="page-header__title">Проставление оценок ученикам</h1>
            </div>

            <div class="content-grid">
                <div class="sidebar">
                    <div class="card">
                        <h2 class="card__title">Новая оценка</h2>
                        <form class="grade-form" method="POST" action="/creategrade">
                            <div class="grade-form__group">
                                <label class="grade-form__label" for="student_id">Ученик</label>
                                {{ selectForm }}
                            </div>

                            <div class="grade-form__group">
                                <label class="grade-form__label" for="subject">Предмет</label>
                                <select class="grade-form__select" id="subject" name="subject" required>
                                    <option value="">Выберите предмет</option>
                                    <option value="Математика">Математика</option>
                                    <option value="Физика">Физика</option>
                                    <option value="Русский">Русский</option>
                                    <option value="Английский">Английский</option>
                                    <option value="Информатика">Информатика</option>
                                    <option value="Немецкий">Немецкий</option>
                                    <option value="Французский">Французский</option>
                                    <option value="Обществознание">Обществознание</option>
                                    <option value="История">История</option>
                                    <option value="Литература">Литература</option>
                                    <option value="Биология">Биология</option>
                                    <option value="География">География</option>
                                    <option value="Экономика">Экономика</option>
                                    <option value="ИЗО">ИЗО</option>
                                    <option value="Музыка">Музыка</option>
                                </select>
                            </div>

                            <div class="grade-form__group">
                                <label class="grade-form__label" for="grade">Оценка</label>
                                <select class="grade-form__select" id="grade" name="grade" required>
                                    <option value="">Выберите оценку</option>
                                    <option value="5">5</option>
                                    <option value="4">4</option>
                                    <option value="3">3</option>
                                    <option value="2">2</option>
                                </select>
                            </div>

                            <div class="grade-form__group">
                                <label class="grade-form__label" for="reason">За что оценка</label>
                                <select class="grade-form__select" id="reason" name="reason" required>
                                    <option value="">Выберите причину</option>
                                    <option value="Домашнее задание">Домашнее задание</option>
                                    <option value="Контрольная работа">Контрольная работа</option>
                                    <option value="Работа на уроке">Работа на уроке</option>
                                    <option value="Проект">Проект</option>
                                    <option value="Эссе">Эссе</option>
                                </select>
                            </div>

                            <div class="grade-form__group">
                                <label class="grade-form__label" for="comment">Комментарий репетитора</label>
                                <textarea class="grade-form__textarea" id="comment" name="comment" placeholder="Напишите комментарий..." maxlength="100" required></textarea>
                            </div>

                            <button type="submit" class="btn btn_primary">Проставить оценку</button>
                        </form>
                    </div>
                </div>

                <div class="main-content">
                    <div class="card">
                        <h2 class="card__title">Активные оценки</h2>
                        <div class="grades-history">{{ gradestemplate }}</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
