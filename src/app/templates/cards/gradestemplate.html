<style>
    .grade-row {
    width: 100%;
    background: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .grade-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 70px;
    }

    .grade-value {
        margin-top: 4px;
        font-size: 1.3rem;
        font-weight: 700;
    }

    .grade-center {
        flex-grow: 1;
    }

    .grade-name {
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .grade-meta {
        font-size: 0.9rem;
        color: #666;
    }

    .grade-meta span {
        display: block;
        margin-top: 2px;
    }

    .grade-right {
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        min-width: 80px;
    }

    .grade-date {
        font-size: 0.85rem;
        color: #999;
    }

    .delete-btn {
        background: #ff4d4d;
        border: none;
        color: white;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        white-space: nowrap;
        transition: background 0.2s ease;
    }

    .delete-btn:hover {
        background: #ff2c2c;
    }

</style>
<form class="grade-row" method="POST" action="/deletegrade">
    <div class="grade-left">
        <span class="subject-badge {{ subject }}">{{ subject }}</span>
        <span class="grade-value">{{ grade }}</span>
    </div>

    <div class="grade-center">
        <div class="grade-name">{{ first_name }} {{ last_name }}</div>
        <div class="grade-meta">
            <span class="grade-why">За что: {{ description }}</span>
            <span class="grade-comment">Комментарий: {{ comment }}</span>
        </div>
    </div>

    <div class="grade-right">
        <span class="grade-date">{{ date }}</span>

        <input type="hidden" name="grade_id" value="{{ grade_id }}">
        <button type="submit" class="delete-btn">Удалить</button>
    </div>
</form>
