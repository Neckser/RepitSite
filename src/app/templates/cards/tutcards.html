<div class="tutor-card">
    <div class="tutor-header">
        <div class="tutor-avatar">{{ avatar }}</div>
        <div class="tutor-info">
            <h3>{{ first_name }} {{ last_name }}</h3>
            <div class="tutor-subjects">{{ subjecttemplate }}</div>
        </div>
    </div>

    <div class="tutor-stats">
        <div class="tutor-stat">
            <div class="tutor-stat__value">{{ lesson_count }}</div>
            <div class="tutor-stat__label">уроков</div>
        </div>
        <div class="tutor-stat">
            <div class="tutor-stat__value">{{ rating }}</div>
            <div class="tutor-stat__label">рейтинг</div>
        </div>
        <div class="tutor-stat">
            <div class="tutor-stat__value">{{ student_colvo }}</div>
            <div class="tutor-stat__label">ученика</div>
        </div>
    </div>

    <div class="tutor-actions">
        <!-- <a href="#" class="tutor-button tutor-button--assignments">Задания</a> -->
        <a href="/studchat/{{ chat_id }}" class="tutor-button tutor-button--message">Написать</a>
    </div>
</div>
