<div class="task-mini-card task-mini-card-image">
    <div class="task-mini-header">
        <span>Задание {{ number }}</span>
        <span class="task-type-badge">📷 Изображение</span>
    </div>
    <div class="task-image-container" onclick="openFullImage('/viewimage/{{ content }}')">
        <img src="/viewimage/{{ content }}" alt="Задание {{ number }}" class="task-image-preview">
        <div class="image-overlay">
            <span class="zoom-icon">🔍</span>
        </div>
    </div>
</div>
