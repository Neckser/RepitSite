<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Редактирование профиля | RepitHub</title>
    </head>
    <body class="page">
        <header class="top-bar">
            <div class="nav-container">
                <div class="nav-buttons">
                    <a href="/tutlist" class="nav-button">Мои репетиторы</a>
                    <a href="/home" class="nav-button">Мои задания</a>
                    <a href="/studgrades" class="nav-button">Мои оценки</a>
                    <a href="/studtime" class="nav-button">Моё расписание</a>
                    <a href="/studtests" class="nav-button">Мои тесты</a>
                </div>

                <a href="/profile" class="account-widget">
                    <div class="user-avatar">{{ avatar }}</div>
                    <div class="user-info">
                        <div class="user-name">{{ first_name }} {{ last_name }}</div>
                        <div class="user-role">Ученик</div>
                    </div>
                </a>
            </div>
        </header>

        <main class="edit-student-profile-page">
            <div class="edit-student-profile-layout">
                <div class="edit-student-profile-sidebar">
                    <h3 class="edit-student-profile-sidebar__title">Редактирование профиля</h3>
                    <div class="edit-student-profile-steps">
                        <a href="#basic" class="edit-student-profile-step edit-student-profile-step--active" data-step="basic">
                            <span class="edit-student-profile-step__number">1</span>
                            <span class="edit-student-profile-step__text">Основная информация</span>
                        </a>
                        <a href="#about" class="edit-student-profile-step" data-step="about">
                            <span class="edit-student-profile-step__number">2</span>
                            <span class="edit-student-profile-step__text">О себе</span>
                        </a>
                    </div>
                </div>

                <div class="edit-student-profile-content">
                    <div class="edit-student-profile-content__header">
                        <h1 class="edit-student-profile-content__title">Редактирование профиля</h1>
                    </div>

                    <div class="edit-student-profile-form__step edit-student-profile-form__step--active" id="step-basic">
                        <form method="POST" action="/updatestudbasic" class="edit-student-profile-form__section">
                            <h2 class="edit-student-profile-form__title">Основная информация</h2>

                            <div class="edit-student-profile-form__grid">
                                <div class="edit-student-profile-form__group">
                                    <label class="edit-student-profile-form__label">
                                        Имя
                                        <span class="edit-student-profile-form__label--required">*</span>
                                    </label>
                                    <input type="text" class="edit-student-profile-form__input" name="first_name" required placeholder="Введите ваше имя" />
                                </div>

                                <div class="edit-student-profile-form__group">
                                    <label class="edit-student-profile-form__label">
                                        Фамилия
                                        <span class="edit-student-profile-form__label--required">*</span>
                                    </label>
                                    <input type="text" class="edit-student-profile-form__input" name="last_name" required placeholder="Введите вашу фамилию" />
                                </div>

                                <div class="edit-student-profile-form__group">
                                    <label class="edit-student-profile-form__label">
                                        Класс
                                        <span class="edit-student-profile-form__label--required">*</span>
                                    </label>
                                    <input type="number" class="edit-student-profile-form__input" name="grade" min="0" max="11" required placeholder="Класс обучения" />
                                </div>
                            </div>

                            <div class="edit-student-profile-form__save">
                                <div class="edit-student-profile-form__save-buttons">
                                    <button type="submit" class="edit-student-profile-button edit-student-profile-button--primary">Сохранить основную информацию</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="edit-student-profile-form__step" id="step-about">
                        <form method="POST" action="/updatestudbio" class="edit-student-profile-form__section">
                            <h2 class="edit-student-profile-form__title">О себе</h2>

                            <div class="edit-student-profile-form__group edit-student-profile-form__group--full-width">
                                <label class="edit-student-profile-form__label">Описание профиля</label>
                                <textarea class="edit-student-profile-form__textarea" name="bio" placeholder="Расскажите о себе"></textarea>
                            </div>

                            <div class="edit-student-profile-form__save">
                                <div class="edit-student-profile-form__save-buttons">
                                    <button type="submit" class="edit-student-profile-button edit-student-profile-button--primary">Сохранить описание</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="edit-student-profile-page__actions">
                        <a href="/profile" class="edit-student-profile-button edit-student-profile-button--outline">Вернуться в профиль</a>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
