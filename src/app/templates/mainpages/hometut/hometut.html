<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Репетитор | RepitHub</title>
    </head>
    <body class="page">
        <header class="top-bar">
            <div class="top-bar__container">
                <div class="top-bar__nav">
                    <a href="/hometut" class="top-bar__nav-button top-bar__nav-button_active">Главная</a>
                    <a href="/homeworkstut" class="top-bar__nav-button">Задания</a>
                    <a href="/tutgrades" class="top-bar__nav-button">Оценки</a>
                    <a href="/tuttime" class="top-bar__nav-button">Расписание</a>
                    <a href="/tuttests" class="top-bar__nav-button">Тесты</a>
                    <a href="/tutchat" class="top-bar__nav-button">Чат</a>
                </div>

                <a href="/profiletut" class="top-bar__account">
                    <div class="top-bar__avatar">{{ avatar }}</div>
                    <div class="top-bar__user-info">
                        <div class="top-bar__user-name">{{ first_name }} {{ last_name }}</div>
                        <div class="top-bar__user-role">Репетитор</div>
                    </div>
                </a>
            </div>
        </header>

        <main class="tutor-dashboard">
            <section class="welcome-section">
                <h1 class="welcome-title">Добро пожаловать, {{ first_name }} {{ last_name }}!</h1>
            </section>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">{{ student_colvo }}</div>
                    <div class="stat-label">Учеников</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">{{ homework_colvo }}</div>
                    <div class="stat-label">Активных заданий</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">{{ lessons_today }}</div>
                    <div class="stat-label">Занятия сегодня</div>
                </div>
            </div>

            <section class="students-section">
                <div class="section-header">
                    <h2 class="section-title">Мои ученики</h2>
                </div>
                <div class="students-grid">{{ studtemplate }}</div>
            </section>
        </main>
    </body>
</html>
