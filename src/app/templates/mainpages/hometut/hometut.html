        <meta charset="UTF-8" />

        <title>Репетитор | RepitHub</title>
    </head>
    <body class="page">
        <header class="top-bar">
            <div class="nav-container">
                <div class="nav-buttons">
                    <a href="/hometut" class="nav-button active">Главная</a>
                    <a href="/homeworkstut" class="nav-button">Задания</a>
                    <a href="/tutgrades" class="nav-button">Оценки</a>
                    <a href="/tuttime" class="nav-button">Расписание</a>
                    <a href="/tuttests" class="nav-button">Тесты</a>
                </div>

                <a href="/profiletut" class="account-widget">
                    <div class="user-avatar">{{ avatar }}</div>
                    <div class="user-info">
                        <div class="user-name">{{ first_name }} {{ last_name }}</div>
                        <div class="user-role">Репетитор</div>
                    </div>
                </a>
            </div>
        </header>

        <main class="tutor-dashboard">
            <section class="welcome-section">
                <h1 class="welcome-title">Добро пожаловать, {{ first_name }} {{ last_name }}!</h1>
            </section>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">{{ student_colvo }}</div>
                    <div class="stat-label">Учеников</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">{{ homework_colvo }}</div>
                    <div class="stat-label">Активных заданий</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">🚧</div>
                    <div class="stat-label">Занятия сегодня</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">🚧</div>
                    <div class="stat-label">Ваш рейтинг</div>
                </div>
            </div>

            <section class="students-section">
                <div class="section-header">
                    <h2 class="section-title">Мои ученики</h2>
                </div>
                <div class="students-grid">{{ studtemplate }}</div>
            </section>
