<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Репетитор | Чат</title>
    </head>
    <body class="body">
        <header class="top-bar">
            <div class="top-bar__container">
                <div class="top-bar__nav">
                    <a href="/hometut" class="top-bar__nav-button">Главная</a>
                    <a href="/homeworkstut" class="top-bar__nav-button">Задания</a>
                    <a href="/tutgrades" class="top-bar__nav-button">Оценки</a>
                    <a href="/tuttime" class="top-bar__nav-button">Расписание</a>
                    <a href="/tuttests" class="top-bar__nav-button">Тесты</a>
                    <a href="/tutchat" class="top-bar__nav-button top-bar__nav-button_active">Чат</a>
                </div>

                <a href="/profiletut" class="top-bar__account">
                    <div class="top-bar__avatar">{{ avatar }}</div>
                    <div class="top-bar__user-info">
                        <div class="top-bar__user-name">{{ first_name }} {{ last_name }}</div>
                        <div class="top-bar__user-role">Репетитор</div>
                    </div>
                </a>
            </div>
        </header>

        <div class="container">
            <div class="page-header">
                <h1 class="page-header__title">Чат-комната</h1>
            </div>

            <div class="content-grid">
                <!-- Левая колонка: контакты -->
                <aside class="sidebar">
                    <div class="card">
                        <h2 class="card__title">Контакты</h2>
                        <div class="contacts-list">
                            <!-- Бекенд подставляет контакты -->
                             {{ contacts_template }}
                        </div>
                    </div>
                </aside>

                <!-- Правая колонка: чат -->
                <main class="main-content">
                    <div class="chat-card">
                        <div class="chat-header">
                            <div class="chat-room-info">
                                <div class="chat-with-name">{{ dialog_first_name }} {{ dialog_last_name }}</div>
                                <div class="connection-status">
                                    <span class="status-indicator" id="statusIndicator"></span>
                                    <span id="statusText">Отключен</span>
                                </div>
                            </div>
                            <!-- <a href="/tuttests" class="leave-button">← К списку чатов</a> -->
                        </div>
                        
                        <!-- Скрытые поля с данными для JavaScript -->
                        <div class="chat-data">
                            <input type="hidden" id="roomId" value="{{ room_name }}">
                            <input type="hidden" id="tutor_id" value="{{ tutor_id }}">
                            <input type="hidden" id="chattutmember" value="{{ tutfirst_name }} {{ tutlast_name }}">  
                            <span id="status" style="display: none;">⚫ Отключен</span>
                        </div>
                        
                        <div class="messages-container">
                            <div id="messages">
                                {{ messages_template }}
                            </div>
                        </div>
                        
                        <form id="form" onsubmit="sendMessage(event)">
                            <input type="text" id="messageText" placeholder="Введите сообщение..." autocomplete="off" disabled>
                            <button type="submit" disabled>Отправить</button>
                        </form>
                    </div>
                </main>
            </div>
        </div>

        <!-- ОРИГИНАЛЬНЫЙ РАБОЧИЙ JAVASCRIPT -->
        <script>
            let ws = null;
            let currentRoom = '';
            let currentUser = '';
            let reconnectAttempts = 0;
            const maxReconnectAttempts = 5;
            
            function getWebSocketUrl(roomId, username) {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                return `${protocol}//${host}/ws/${roomId}?username=${encodeURIComponent(username)}`;
            }
            
            function updateConnectionStatus(isConnected, roomId = '') {
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                
                if (isConnected) {
                    indicator.className = 'status-indicator connected';
                    statusText.textContent = 'Подключен к ' + roomId;
                    statusText.style.color = '#4caf50';
                } else {
                    indicator.className = 'status-indicator disconnected';
                    statusText.textContent = 'Отключен';
                    statusText.style.color = '#f44336';
                }
            }
            
            function connect() {
                const roomId = document.getElementById('roomId').value;
                const username = document.getElementById('chattutmember').value;
                
                currentRoom = roomId;
                currentUser = username;
                
                if (ws) {
                    ws.close();
                }
                
                try {
                    const wsUrl = getWebSocketUrl(roomId, username);
                    console.log('Connecting to:', wsUrl);
                    ws = new WebSocket(wsUrl);
                    
                    ws.onopen = function() {
                        console.log('WebSocket connected');
                        reconnectAttempts = 0;
                        document.getElementById('status').innerHTML = '🟢 Подключен';
                        document.getElementById('status').style.color = 'green';
                        document.getElementById('messageText').disabled = false;
                        document.querySelector('button[type="submit"]').disabled = false;
                        
                        updateConnectionStatus(true, roomId);
                        addMessage('Система', 'Вы подключились к чату', 'system');
                    };
                    
                    ws.onmessage = function(event) {
                        try {
                            const data = JSON.parse(event.data);
                            
                            if (data.type === 'message') {
                                const messageClass = (data.sender === currentUser) ? 'my-message' : 'other-message';
                                addMessage(data.sender, data.text, messageClass);
                            } else if (data.type === 'system') {
                                addMessage('Система', data.text, 'system');
                            } else if (data.type === 'users') {
                                console.log('Пользователи онлайн:', data.users);
                            }
                        } catch (e) {
                            console.error('Error parsing message:', e);
                        }
                    };
                    
                    ws.onclose = function(event) {
                        console.log('WebSocket closed:', event);
                        document.getElementById('status').innerHTML = '⚫ Отключен';
                        document.getElementById('status').style.color = 'red';
                        document.getElementById('messageText').disabled = true;
                        document.querySelector('button[type="submit"]').disabled = true;
                        
                        updateConnectionStatus(false);
                        
                        if (reconnectAttempts < maxReconnectAttempts) {
                            reconnectAttempts++;
                            setTimeout(connect, 3000);
                            addMessage('Система', `Попытка переподключения ${reconnectAttempts}/${maxReconnectAttempts}...`, 'system');
                        } else {
                            addMessage('Система', 'Не удалось подключиться к серверу. Обновите страницу.', 'system');
                        }
                    };
                    
                    ws.onerror = function(error) {
                        console.error('WebSocket ошибка:', error);
                        addMessage('Система', 'Ошибка соединения', 'system');
                    };
                    
                } catch (error) {
                    console.error('Error creating WebSocket:', error);
                }
            }
            
            function sendMessage(event) {
                event.preventDefault();
                const input = document.getElementById('messageText');
                const text = input.value.trim();
                const roomId = document.getElementById('roomId').value;
                const tutor_id = document.getElementById('tutor_id').value;
                        
                if (text && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'message',
                        text: text
                    }));

                    fetch('/savetutmessage', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            room_id: roomId,
                            sender_id: tutor_id,
                            sender_type: 'tutor',
                            text: text,
                            timestamp: new Date().toISOString()
                        })
                    }).catch(error => console.error('Ошибка сохранения:', error));

                    input.value = '';
                } else if (ws && ws.readyState !== WebSocket.OPEN) {
                    addMessage('Система', 'Соединение потеряно. Переподключаемся...', 'system');
                    connect();
                }
            }

            function addMessage(sender, text, className = 'other-message') {
                const messages = document.getElementById('messages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${className}`;
                
                const time = new Date().toLocaleTimeString();
                messageDiv.innerHTML = `<strong>${sender}</strong> [${time}]<br>${text}`;
                
                messages.appendChild(messageDiv);
                messages.scrollTop = messages.scrollHeight;
            }
            
            window.onload = function() {
                connect();
            };
        </script>
    </body>
</html>
