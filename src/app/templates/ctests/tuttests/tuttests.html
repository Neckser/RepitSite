<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои тесты | RepitHub</title>
</head>
<body>
<header class="top-bar">
    <div class="nav-container">
        <div class="nav-buttons">
            <a href="/hometut" class="nav-button">Главная</a>
            <a href="/homeworkstut" class="nav-button">Задания</a>
            <a href="/tutgrades" class="nav-button">Оценки</a>
            <a href="/tuttime" class="nav-button">Расписание</a>
            <a href="/tuttests" class="nav-button active">Тесты</a>
            <a href="/tutchat" class="nav-button">Чат</a>
        </div>
        <a href="/profiletut" class="account-widget">
            <div class="user-avatar">{{ avatar }}</div>
            <div class="user-info">
                <div class="user-name">{{ first_name }} {{ last_name }}</div>
                <div class="user-role">Репетитор</div>
            </div>
        </a>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1>Все тесты</h1>
    </div>

    <div class="tests-grid">
        {{ tests_template }}
        <a href="/tutctest" class="add-test-card">
            <div class="add-test-card__icon">+</div>
            <div class="add-test-card__text">Добавить тест</div>
        </a>
        <a href="/tutaddyandex" class="add-yandex-card">
            <img src="yandexlogo.svg" alt="Yandex" class="yandex-logo">
            <div class="add-yandex-plus">+</div>
            <div class="add-yandex-card__text">Добавить Яндекс Контест</div>
            <div class="add-yandex-card__sub">Импорт из Яндекс.Контест</div>
        </a>
    </div>
</div>
</body>
</html>
