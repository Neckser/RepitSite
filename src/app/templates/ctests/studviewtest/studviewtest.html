<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прохождение теста | RepitHub</title>
</head>
<body data-test-time-minutes="{{ duration }}" data-test-id="{{ test_id }}">
<div class="timeout-modal" id="timeout-modal">
    <div class="modal-content">
        <div class="modal-icon">⏰</div>
        <h2 class="modal-title">Время вышло!</h2>
        <p class="modal-text">Время на прохождение теста истекло. Тест будет автоматически завершен, и вы будете перенаправлены на главную страницу.</p>
        <p class="modal-text" id="redirect-countdown">Перенаправление через: 5 секунд</p>
    </div>
</div>

<header class="top-bar">
</header>

<div class="container">
    <form method="POST" action="/studanswertest" id="test-form">
        <input type="hidden" name="test_id" value="{{ test_id }}">
        <input type="hidden" name="time_spent" id="time-spent-input" value="0">
        
        <div class="test-header">
            <div class="test-header__top">
                <div class="test-title">{{ subject }} · {{ title }}</div>
                <div class="test-timer" id="test-timer">⏱ Осталось: </div>
            </div>
            <div class="test-progress">
                <div class="progress-bar">
                    <div class="progress-bar__fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">Вопрос 1 из 5</div>
            </div>
        </div>

        {{ questions_template }}
        
        <div class="question-dots" id="question-dots"></div>
        
        <div class="test-actions">
            <button type="button" class="btn btn-secondary" id="prev-btn">← Назад</button>
            <button type="button" class="btn btn-primary" id="next-btn">Далее →</button>
            <button type="submit" class="btn btn-danger" id="finish-btn">Завершить тест</button>
        </div>
    </form>
</div>
</body>
